{% extends "base.html" %}{% block title %}Edit transaction{% endblock %}
{% block content %}
<div class="narrow"><section class="panel"><h1>Edit transaction</h1>
<form method="post" class="stack">
<label>Description<input name="description" value="{{ item.description }}" required></label>
<label>Amount (₹)<input name="amount" type="number" min="0.01" step="0.01" value="{{ item.amount }}" required></label>
<label>Date<input name="tx_date" type="date" value="{{ item.tx_date }}" required></label>
<label>Category<select name="category">{% if item.tx_type == 'expense' %}<option>Auto-detect</option>{% endif %}{% for cat in categories %}<option {% if item.category == cat %}selected{% endif %}>{{ cat }}</option>{% endfor %}</select></label>
<button class="primary">Save changes</button><a href="{{ url_for('transactions') }}" class="cancel-link">Cancel</a>
</form></section></div>
{% endblock %}
