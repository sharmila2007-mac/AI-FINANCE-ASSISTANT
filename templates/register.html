{% extends "base.html" %}{% block title %}Register | AI Finance Assistant{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="brand-mark">₹</div><h1>Create your account</h1><p class="muted">Your personal finance workspace starts here.</p>
  <form method="post" class="stack">
    <label>Full name<input name="name" placeholder="Your name" required></label>
    <label>Email<input type="email" name="email" placeholder="you@example.com" required></label>
    <label>Password<input type="password" name="password" minlength="8" placeholder="At least 8 characters" required></label>
    <button class="primary">Create account</button>
  </form>
  <p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
